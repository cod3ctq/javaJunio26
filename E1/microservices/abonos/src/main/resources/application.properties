spring.application.name=abonos
server.port = 8099

# Runtime Oracle JDBC configuration
spring.datasource.url=jdbc:oracle:thin:@host.docker.internal:1521:xe
spring.datasource.username=db1
spring.datasource.password=admin
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.database-platform=org.hibernate.dialect.Oracle19cDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
jakarta.persistence.jdbc.url=${spring.datasource.url}
jakarta.persistence.jdbc.user=${spring.datasource.username}
jakarta.persistence.jdbc.password=${spring.datasource.password}
##Configure Hikari Pool Connections
spring.datasource.hikari.connection-timeout=4000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=true
